<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สำนักกระทรวงเวทมนต์ศาสตร์</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            .random {
    background: #f59e0b;
}
        }

        .container {
            max-width: 1000px;
            margin: 80px auto;
            text-align: center;
        }

        h1 {
            color: #1e293b;
        }

        .cards {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-top: 40px;
        }

        .card {
            width: 300px;
            padding: 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .card h2 {
            margin-bottom: 15px;
        }

        .card p {
            color: #64748b;
            line-height: 1.6;
        }

        button {
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .ดูดวงวันนี้ {
            background: #2563eb;
        }

        .share {
            background: #16a34a;
        }

        button:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>กระทรวงเวทมนต์ศาสตร์</h1>

    <div class="cards">

        <!-- คำทำนายสำหรับวันนี้ -->
        <div class="card">
            <h2>📚 น้อมรับคำทำนาย</h2>

            <p>
                ตัวช่วยแหล่งรวมของขลัง 1 ตำบล 1 ของขลัง
            </p>

            <button
                class="knowledge"
                onclick="goToKnowledge()">
                คลังของขลัง
            </button>
        </div>


        <!-- Share -->
        <div class="card">
            <h2>🤝 Share</h2>

            <div class="card">
    <h2>🎲 เลขเด็ด</h2>

    <p>
        สุ่มตัวเลขตั้งแต่ 1 ถึง 9
        สำหรับใช้งานหรือเล่นสนุก
    </p>

    <button
        class="random"
        onclick="goToRandom()">
        ไปหน้าสุ่มเลข
    </button>
</div>

            <p>
                
                คนดวงดีแห่งปี 2026
            </p>

            <button
                class="share"
                onclick="goToShare()">
                ไปหน้า Share
            </button>
        </div>

    </div>

</div>


<script>

    // ปุ่ม ดูดวงวันนี้
    function goToKnowledge() {
        window.location.href = "knowledge.html";
    }


    // ปุ่ม Share
    function goToShare() {
        window.location.href = "share.html";

    // ไปหน้าสุ่มเลข  
    }
    function goToRandom() {
    window.location.href = "random.html";
}

</script>

</body>
</html>
