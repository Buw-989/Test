<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>สำนักกระทรวงเวทมนต์ศาสตร์</title>


    <style>

        /* =========================================
           🌈 พื้นหลังสีรุ้งพาสเทลเคลื่อนไหวช้า ๆ
        ========================================= */

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            min-height: 100vh;

            text-align: center;

            padding-top: 100px;

            background: linear-gradient(
                135deg,
                #ffd6e7,
                #ffe5c2,
                #fff8b8,
                #d9f7be,
                #c7f0ff,
                #d9d2ff,
                #f4d4ff,
                #ffd6e7
            );

            background-size: 600% 600%;

            animation:
                pastelRainbow 25s ease-in-out infinite;

        }


        /* Animation สีรุ้ง */

        @keyframes pastelRainbow {

            0% {
                background-position: 0% 50%;
            }

            25% {
                background-position: 50% 0%;
            }

            50% {
                background-position: 100% 50%;
            }

            75% {
                background-position: 50% 100%;
            }

            100% {
                background-position: 0% 50%;
            }

        }


        /* =========================================
           Container
        ========================================= */

        .container {

            max-width: 1100px;

            margin: 80px auto;

            text-align: center;

            padding: 20px;

        }


        /* =========================================
           หัวข้อ
        ========================================= */

        h1 {

            color: #374151;

            font-size: 36px;

            text-shadow:
                0 2px 5px
                rgba(255,255,255,0.7);

        }


        .subtitle {

            color: #64748b;

            margin-bottom: 40px;

        }


        /* =========================================
           กล่องเมนู
        ========================================= */

        .cards {

            display: flex;

            gap: 30px;

            justify-content: center;

            align-items: stretch;

            flex-wrap: wrap;

            margin-top: 40px;

        }


        .card {

            width: 280px;

            padding: 30px;

            background: rgba(255,255,255,0.90);

            border-radius: 20px;

            box-shadow:
                0 8px 25px
                rgba(100,100,100,0.12);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;

            backdrop-filter: blur(5px);

        }


        .card:hover {

            transform: translateY(-8px);

            box-shadow:
                0 15px 30px
                rgba(100,100,100,0.18);

        }


        .card h2 {

            margin-bottom: 15px;

            color: #374151;

        }


        .card p {

            color: #64748b;

            line-height: 1.6;

            min-height: 50px;

        }


        /* =========================================
           ปุ่มทั้งหมด
        ========================================= */

        button {

            border: none;

            padding: 12px 25px;

            border-radius: 10px;

            color: white;

            font-size: 16px;

            cursor: pointer;

            transition: 0.2s;

        }


        button:hover {

            opacity: 0.85;

            transform: scale(1.05);

        }


        /* =========================================
           ปุ่มคำทำนาย
        ========================================= */

        .knowledge {

            background: #93c5fd;

        }


        /* =========================================
           ปุ่ม Share
        ========================================= */

        .share {

            background: #86efac;

        }


        /* =========================================
           ปุ่มเลขเด็ด
        ========================================= */

        .random {

            background: #fcd34d;

        }


    </style>

</head>


<body>


<div class="container">


    <h1>🔮 กระทรวงเวทมนต์ศาสตร์</h1>


    <p class="subtitle">

        สำนักรวมพลังเวทมนต์ ของขลัง และคำทำนาย

    </p>


    <div class="cards">


        <!-- ========================= -->
        <!-- คำทำนาย -->
        <!-- ========================= -->

        <div class="card">

            <h2>🔮 คำทำนาย</h2>

            <p>

                ดวงวันนี้ ดีแน่นอลลลลล

            </p>

            <button
                class="knowledge"
                onclick="goToKnowledge()">

                📚 น้อมรับคำทำนาย

            </button>

        </div>


        <!-- ========================= -->
        <!-- Share -->
        <!-- ========================= -->

        <div class="card">

            <h2>🤝 Share</h2>

            <p>

                คนดวงดีแห่งปี 2026
                มาแบ่งปันเรื่องราวและประสบการณ์

            </p>

            <button
                class="share"
                onclick="goToShare()">

                🤝 ไปหน้า Share

            </button>

        </div>


        <!-- ========================= -->
        <!-- เลขเด็ด -->
        <!-- ========================= -->

        <div class="card">

            <h2>🎲 เลขเด็ด</h2>

            <p>

                สุ่มตัวเลขตั้งแต่ 1 ถึง 100 🙏
                สำหรับเลขที่คิดว่าอาจจะออกงวดนี้ 🔮

            </p>

            <button
                class="random"
                onclick="goToRandom()">

                🎲 ไปหน้าเลขเด็ด

            </button>

        </div>


    </div>

</div>


<script>


    // =====================================
    // ปุ่ม คำทำนาย
    // =====================================

    function goToKnowledge() {

        window.location.href =
            "knowledge.html";

    }


    // =====================================
    // ปุ่ม Share
    // =====================================

    function goToShare() {

        window.location.href =
            "share.html";

    }


    // =====================================
    // ปุ่ม เลขเด็ด
    // =====================================

    function goToRandom() {

        window.location.href =
            "random.html";

    }


</script>


</body>

</html>
