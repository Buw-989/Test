<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>สำนักกระทรวงเวทมนต์ศาสตร์</title>


    <style>

       body {
    font-family: Arial, sans-serif;

    background: linear-gradient(
        135deg,
        red,
        orange,
        yellow,
        green,
        cyan,
        blue,
        violet
    );

    background-size: 400% 400%;

    animation: rainbow 10s ease infinite;

    text-align: center;

    padding-top: 100px;
}


@keyframes rainbow {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }

}


        .container {
            max-width: 1100px;
            margin: 80px auto;
            text-align: center;
            padding: 20px;
        }


        h1 {
            color: #1e293b;
            font-size: 36px;
        }


        .subtitle {
            color: #64748b;
            margin-bottom: 40px;
        }


        /* กล่องเมนู */

        .cards {
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: stretch;
            flex-wrap: wrap;
            margin-top: 40px;
        }


        .card {
            width: 280px;
            padding: 30px;
            background: white;
            border-radius: 20px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.1);

            transition: 0.3s;
        }


        .card:hover {
            transform: translateY(-5px);

            box-shadow:
                0 10px 25px
                rgba(0,0,0,0.15);
        }


        .card h2 {
            margin-bottom: 15px;
        }


        .card p {
            color: #64748b;
            line-height: 1.6;
            min-height: 50px;
        }


        /* ปุ่มทั้งหมด */

        button {
            border: none;
            padding: 12px 25px;
            border-radius: 10px;

            color: white;

            font-size: 16px;

            cursor: pointer;

            transition: 0.2s;
        }


        button:hover {
            opacity: 0.8;
            transform: scale(1.03);
        }


        /* น้อมรับคำทำนาย🌞 */

        .knowledge {
            background: #2563eb;
        }


        /* ปุ่ม ของดีบอกต่อ */

        .share {
            background: #16a34a;
        }


        /* ปุ่มเลขเด็ด */

        .random {
            background: #f59e0b;
        }


    </style>

</head>


<body>


<div class="container">


    <h1>🔮 กระทรวงเวทมนต์ศาสตร์</h1>

    <p class="subtitle">
        สำนักรวมพลังเวทมนต์ ของขลัง และคำทำนาย
    </p>


    <div class="cards">


        <!-- ========================= -->
        <!-- คลังของขลัง -->
        <!-- ========================= -->

        <div class="card">

            <h2>🔮 คำทำนาย</h2>

            <p>
ดวงวันนี้ ดีแน่นอลลลลล
            </p>

            <button
                class="knowledge"
                onclick="goToKnowledge()">

                📚 น้อมรับคำทำนาย

            </button>

        </div>


        <!-- ========================= -->
        <!-- Share -->
        <!-- ========================= -->

        <div class="card">

            <h2>🤝 Share</h2>

            <p>
                คนดวงดีแห่งปี 2026
                มาแบ่งปันเรื่องราวและประสบการณ์
            </p>

            <button
                class="share"
                onclick="goToShare()">

                🤝 ไปหน้า Share

            </button>

        </div>


        <!-- ========================= -->
        <!-- เลขเด็ด -->
        <!-- ========================= -->

        <div class="card">

            <h2>🎲 เลขเด็ด</h2>

            <p>
                สุ่มตัวเลขตั้งแต่ 1 ถึง 100 🙏
                สำหรับเลขที่คิดว่าอาจจะออกงวดนี้ 🔮
            </p>

            <button
                class="random"
                onclick="goToRandom()">

                🎲 ไปหน้าเลขเด็ด

            </button>

        </div>


    </div>

</div>


<script>


    // =====================================
    // ปุ่ม คลังของขลัง
    // =====================================

    function goToKnowledge() {

        window.location.href =
            "knowledge.html";

    }


    // =====================================
    // ปุ่ม Share
    // =====================================

    function goToShare() {

        window.location.href =
            "share.html";

    }


    // =====================================
    // ปุ่ม เลขเด็ด
    // =====================================

    function goToRandom() {

        window.location.href =
            "random.html";

    }


</script>


</body>

</html>
