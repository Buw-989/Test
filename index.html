<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge & Share</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .container {
            max-width: 1000px;
            margin: 80px auto;
            text-align: center;
        }

        h1 {
            color: #1e293b;
        }

        .cards {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-top: 40px;
        }

        .card {
            width: 300px;
            padding: 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .card h2 {
            margin-bottom: 15px;
        }

        .card p {
            color: #64748b;
            line-height: 1.6;
        }

        button {
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .knowledge {
            background: #2563eb;
        }

        .share {
            background: #16a34a;
        }

        button:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Knowledge & Share</h1>

    <div class="cards">

        <!-- Knowledge -->
        <div class="card">
            <h2>📚 Knowledge</h2>

            <p>
                แหล่งรวมความรู้ บทเรียน
                และข้อมูลสำหรับการพัฒนาทักษะ
            </p>

            <button
                class="knowledge"
                onclick="goToKnowledge()">
                ดู Knowledge
            </button>
        </div>


        <!-- Share -->
        <div class="card">
            <h2>🤝 Share</h2>

            <p>
                แบ่งปันความรู้ ประสบการณ์
                และไอเดียให้กับเพื่อนร่วมงาน
            </p>

            <button
                class="share"
                onclick="goToShare()">
                ไปหน้า Share
            </button>
        </div>

    </div>

</div>


<script>

    // ปุ่ม Knowledge
    function goToKnowledge() {
        window.location.href = "knowledge.html";
    }


    // ปุ่ม Share
    function goToShare() {
        window.location.href = "share.html";
    }

</script>

</body>
</html>
